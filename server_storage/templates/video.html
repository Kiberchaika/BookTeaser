<!DOCTYPE html>
<html>
<head>
    <title>Ваше видео</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            max-width: 100%;
            margin: 20px 0;
        }
        .download-btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        .error-message {
            color: #856404;
            background-color: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .loading-clock {
            width: 24px;
            height: 24px;
            border: 3px solid #856404;
            border-radius: 50%;
            border-top: 3px solid transparent;
            animation: spin 2s linear infinite;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .error-content {
            flex: 1;
        }
        .error-content p {
            margin: 0 0 10px 0;
        }
        .error-content p:last-child {
            margin-bottom: 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ваше видео</h1>
       
        {% if video_exists %}
            <video controls>
                <source src="{{ url_for('download_video', filename=filename) }}" type="video/mp4">
                Ваш браузер не поддерживает тег video.
            </video>
            <div>
                <a href="{{ download_url }}" class="download-btn">Скачать видео</a>
            </div>
        {% else %}
            <div class="error-message">
                <div class="loading-clock"></div>
                <div class="error-content">
                    <p>Видео ещё обрабатывается. Зайдите позже.</p>
                    <p>Сохраните ссылку на эту страницу, чтобы получить видео:</p>
                    <p><a href="{{ request.url }}">{{ request.url }}</a></p>
                </div>
            </div>
            <script>
                // Auto refresh every 10 seconds when video is not ready
                setTimeout(function() {
                    window.location.reload();
                }, 10000);
            </script>
        {% endif %}
    </div>
</body>
</html>
